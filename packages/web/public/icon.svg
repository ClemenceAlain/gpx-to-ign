<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cartes IGN">
  <!--
    The app's own signature: two A4 page footprints, in the red the printed overview uses,
    stepping up a trace. Three shapes, because at 16 px nothing else survives — and the
    rectangles keep A4's proportion so they read as pages rather than squares.
  -->
  <rect width="64" height="64" rx="14" fill="#f2f2f7" />
  <path
    d="M13 53 C19 44 22 40 30 33 C38 26 39 19 45 11"
    fill="none"
    stroke="#007aff"
    stroke-width="4.5"
    stroke-linecap="round"
  />
  <rect x="8" y="27" width="20" height="28" rx="2" fill="#d91919" fill-opacity="0.13" stroke="#d91919" stroke-width="3" />
  <rect x="31" y="9" width="20" height="28" rx="2" fill="#d91919" fill-opacity="0.13" stroke="#d91919" stroke-width="3" />
</svg>
