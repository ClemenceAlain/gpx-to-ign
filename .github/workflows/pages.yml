name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The app is fully client-side, so deploying it is copying a directory.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Pages serves the app from /gpx-to-ign/, not from the domain root.
      - name: Build
        run: npm run build --workspace @gpx-to-ign/web -- --base=/gpx-to-ign/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: packages/web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
