name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Work out the version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: |
          npm run typecheck
          npx vitest run

      # Tested in the shell, not in `if:` — a step's own `env` block is not visible to its
      # own condition, so the old workflow's `if: env.KEYSTORE_BASE64 != ''` never fired and
      # every release was silently debug-signed.
      - name: Restore the signing key, if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > packages/mobile/android/release.keystore
            echo "signing with the configured release key"
          else
            echo "no KEYSTORE_BASE64 secret; the APK will be debug-signed"
          fi

      - name: Sync the web build into the Android project
        run: npm run sync --workspace @gpx-to-ign/mobile

      - name: Build the release APK
        working-directory: packages/mobile/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName='${{ steps.version.outputs.name }}' \
            -PappVersionCode='${{ steps.version.outputs.code }}'
          mv app/build/outputs/apk/release/app-release.apk \
             "$GITHUB_WORKSPACE/gpx-to-ign-${{ steps.version.outputs.tag }}.apk"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.version.outputs.tag }}' \
            --title 'gpx-to-ign ${{ steps.version.outputs.tag }}' \
            --generate-notes \
            'gpx-to-ign-${{ steps.version.outputs.tag }}.apk' \
            || gh release upload '${{ steps.version.outputs.tag }}' \
                 'gpx-to-ign-${{ steps.version.outputs.tag }}.apk' --clobber
